name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cvxpy clarabel ecos numpy
      - name: Solver matches Clarabel and ECOS on the same problems
        run: python3 test/reference_check.py
      - name: Closed-loop landings for every vehicle and world
        run: node test/landings.js
      - name: Page builds from source
        run: python3 build.py
